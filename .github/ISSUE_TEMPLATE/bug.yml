name: 🐞 Bug
description: Something doesn't work (installer, scanner, adapter, prompt)
labels: [bug]
body:
  - type: textarea
    id: what
    attributes: { label: What happened and what did you expect? }
    validations: { required: true }
  - type: input
    id: env
    attributes: { label: "OS / AI tool / Python or Node version" }
