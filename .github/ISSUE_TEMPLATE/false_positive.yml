name: 🎯 False positive
description: The scanner flagged code that is actually safe
labels: [false-positive, scanner]
body:
  - type: input
    id: rule
    attributes: { label: Rule ID, placeholder: "e.g. XSS001" }
    validations: { required: true }
  - type: textarea
    id: code
    attributes: { label: Minimal code snippet (remove secrets!), render: text }
    validations: { required: true }
  - type: textarea
    id: why
    attributes: { label: Why is it safe? }
