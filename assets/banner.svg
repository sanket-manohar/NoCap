<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" width="1280" height="400" role="img" aria-label="NoCap — Your AI wrote the code. NoCap makes it documented, secure and compliant.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#140a26"/>
      <stop offset="1" stop-color="#2a1052"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="0.5" stop-color="#f472b6"/>
      <stop offset="1" stop-color="#fb923c"/>
    </linearGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c4b5fd"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.04"/>
    </pattern>
  </defs>
  <rect width="1280" height="400" fill="url(#bg)"/>
  <rect width="1280" height="400" fill="url(#grid)"/>
  <circle cx="1120" cy="60" r="180" fill="#f472b6" opacity="0.08"/>
  <circle cx="160" cy="380" r="200" fill="#a78bfa" opacity="0.08"/>

  <!-- shield with check -->
  <g transform="translate(120 92)">
    <path d="M108 0 L216 40 V112 C216 180 170 222 108 248 C46 222 0 180 0 112 V40 Z" fill="url(#shield)"/>
    <path d="M108 18 L198 51 V112 C198 168 160 204 108 228 C56 204 18 168 18 112 V51 Z" fill="#1b0d33" opacity="0.55"/>
    <path d="M62 124 L96 158 L160 90" fill="none" stroke="#ffffff" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <text x="400" y="178" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="96" font-weight="800" fill="#ffffff" letter-spacing="-2">No<tspan fill="url(#accent)">Cap</tspan></text>
  <text x="404" y="236" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="30" fill="#e9e3ff">Your AI wrote the code. NoCap makes it</text>
  <text x="404" y="276" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#ffffff">documented · secure · compliant.</text>
  <g font-family="JetBrains Mono, Consolas, monospace" font-size="20" fill="#c4b5fd">
    <rect x="404" y="306" width="560" height="44" rx="10" fill="#ffffff" fill-opacity="0.07" stroke="#a78bfa" stroke-opacity="0.4"/>
    <text x="424" y="335"><tspan fill="#f472b6">$</tspan> nocap docs  ·  audit  ·  ship  🧢</text>
  </g>
</svg>
